        // State
        let currentIndex = 0;
        let isFlipped = false;
        let knownCards = new Set();
        let reviewLaterCards = new Set();

        // DOM elements
        const flashcard = document.getElementById('flashcard');
        const flipBtn = document.getElementById('flipBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const knowBtn = document.getElementById('knowBtn');
        const reviewBtn = document.getElementById('reviewBtn');
        const playAudioBtn = document.getElementById('playAudio');
        const darkModeToggle = document.getElementById('darkModeToggle');

        // Initialize
        function init() {
            loadCard(currentIndex);
            updateProgress();
            setupDarkMode();
        }

        // Load card content
        function loadCard(index) {
            const card = flashcards[index];
            document.getElementById('koreanWord').textContent = card.korean;
            document.getElementById('englishWord').textContent = card.english;
            document.getElementById('exampleKorean').textContent = card.exampleKorean;
            document.getElementById('exampleEnglish').textContent = card.exampleEnglish;

            // Reset flip state
            if (isFlipped) {
                flashcard.classList.remove('is-flipped');
                isFlipped = false;
            }

            // Update button states
            updateButtonStates();
        }

        // Update progress
        function updateProgress() {
            const current = currentIndex + 1;
            const total = flashcards.length;
            document.getElementById('currentCard').textContent = current;
            document.getElementById('totalCards').textContent = total;

            const percentage = (current / total) * 100;
            document.getElementById('progressBar').style.width = percentage + '%';
        }

        // Update button states
        function updateButtonStates() {
            prevBtn.disabled = currentIndex === 0;
            prevBtn.style.opacity = currentIndex === 0 ? '0.5' : '1';

            nextBtn.disabled = currentIndex === flashcards.length - 1;
            nextBtn.style.opacity = currentIndex === flashcards.length - 1 ? '0.5' : '1';

            // Update tracking button styles
            if (knownCards.has(currentIndex)) {
                knowBtn.classList.add('ring-2', 'ring-success');
            } else {
                knowBtn.classList.remove('ring-2', 'ring-success');
            }

            if (reviewLaterCards.has(currentIndex)) {
                reviewBtn.classList.add('ring-2', 'ring-warning');
            } else {
                reviewBtn.classList.remove('ring-2', 'ring-warning');
            }
        }

        // Flip card
        flipBtn.addEventListener('click', () => {
            flashcard.classList.toggle('is-flipped');
            isFlipped = !isFlipped;
        });

        // Previous card
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                loadCard(currentIndex);
                updateProgress();
            }
        });

        // Next card
        nextBtn.addEventListener('click', () => {
            if (currentIndex < flashcards.length - 1) {
                currentIndex++;
                loadCard(currentIndex);
                updateProgress();
            }
        });

        // I know this
        knowBtn.addEventListener('click', () => {
            if (knownCards.has(currentIndex)) {
                knownCards.delete(currentIndex);
            } else {
                knownCards.add(currentIndex);
                reviewLaterCards.delete(currentIndex);
            }
            updateButtonStates();

            // Auto advance to next card
            setTimeout(() => {
                if (currentIndex < flashcards.length - 1) {
                    nextBtn.click();
                }
            }, 300);
        });

        // Review later
        reviewBtn.addEventListener('click', () => {
            if (reviewLaterCards.has(currentIndex)) {
                reviewLaterCards.delete(currentIndex);
            } else {
                reviewLaterCards.add(currentIndex);
                knownCards.delete(currentIndex);
            }
            updateButtonStates();

            // Auto advance to next card
            setTimeout(() => {
                if (currentIndex < flashcards.length - 1) {
                    nextBtn.click();
                }
            }, 300);
        });

        // Play audio (placeholder - would need actual audio files)
        playAudioBtn.addEventListener('click', () => {
            // In a real implementation, you would use the Web Speech API or audio files
            const utterance = new SpeechSynthesisUtterance(flashcards[currentIndex].korean);
            utterance.lang = 'ko-KR';
            window.speechSynthesis.speak(utterance);
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowLeft':
                    if (!prevBtn.disabled) prevBtn.click();
                    break;
                case 'ArrowRight':
                    if (!nextBtn.disabled) nextBtn.click();
                    break;
                case ' ':
                case 'Enter':
                    e.preventDefault();
                    flipBtn.click();
                    break;
                case '1':
                    knowBtn.click();
                    break;
                case '2':
                    reviewBtn.click();
                    break;
            }
        });

        // Dark mode
        function setupDarkMode() {
            const htmlElement = document.documentElement;
            const darkModeIcon = document.querySelector('.dark-mode-icon');

            const currentTheme = localStorage.getItem('theme') || 'light';
            htmlElement.classList.remove('light', 'dark');
            htmlElement.classList.add(currentTheme);
            updateDarkModeIcon(currentTheme);

            darkModeToggle.addEventListener('click', () => {
                const isDark = htmlElement.classList.contains('dark');

                if (isDark) {
                    htmlElement.classList.remove('dark');
                    htmlElement.classList.add('light');
                    localStorage.setItem('theme', 'light');
                    updateDarkModeIcon('light');
                } else {
                    htmlElement.classList.remove('light');
                    htmlElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                    updateDarkModeIcon('dark');
                }
            });

            function updateDarkModeIcon(theme) {
                if (theme === 'dark') {
                    darkModeIcon.textContent = 'light_mode';
                } else {
                    darkModeIcon.textContent = 'dark_mode';
                }
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
