<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Korean Vocabulary Quiz</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <style type="text/tailwindcss">
        body {
            font-family: 'Lexend', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2b6cee",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                        "success": "#81C784",
                        "error": "#E57373"
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark">
    <div class="relative flex min-h-screen w-full flex-col group/design-root overflow-x-hidden">
        <!-- TopNavBar Component -->
        <header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-slate-200 dark:border-slate-800 px-4 sm:px-6 md:px-10 py-3">
            <div class="flex items-center gap-4 text-slate-900 dark:text-white">
                <div class="size-6 text-primary">
                    <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                        <path d="M44 11.2727C44 14.0109 39.8386 16.3957 33.69 17.6364C39.8386 18.877 44 21.2618 44 24C44 26.7382 39.8386 29.123 33.69 30.3636C39.8386 31.6043 44 33.9891 44 36.7273C44 40.7439 35.0457 44 24 44C12.9543 44 4 40.7439 4 36.7273C4 33.9891 8.16144 31.6043 14.31 30.3636C8.16144 29.123 4 26.7382 4 24C4 21.2618 8.16144 18.877 14.31 17.6364C8.16144 16.3957 4 14.0109 4 11.2727C4 7.25611 12.9543 4 24 4C35.0457 4 44 7.25611 44 11.2727Z" fill="currentColor"></path>
                    </svg>
                </div>
                <h2 class="text-lg font-bold tracking-tight">VocabKo</h2>
            </div>
            <div class="hidden md:flex items-center gap-9">
                <a class="text-sm font-medium text-slate-800 dark:text-slate-300 hover:text-primary dark:hover:text-primary" href="index.html">Home</a>
                <a class="text-sm font-medium text-slate-800 dark:text-slate-300 hover:text-primary dark:hover:text-primary" href="flashcard.html">Decks</a>
                <a class="text-sm font-medium text-primary dark:text-primary" href="quiz.html">Practice</a>
                <a class="text-sm font-medium text-slate-800 dark:text-slate-300 hover:text-primary dark:hover:text-primary" href="progress.html">Progress</a>
                <a class="text-sm font-medium text-slate-800 dark:text-slate-300 hover:text-primary dark:hover:text-primary" href="profile.html">Profile</a>
            </div>
            <div class="flex items-center gap-4">
                <button id="darkModeToggle" class="flex items-center justify-center cursor-pointer rounded-lg h-10 px-3 bg-gray-200/80 dark:bg-gray-700/80 hover:bg-gray-300 dark:hover:bg-gray-600" title="Toggle dark mode">
                    <span class="material-symbols-outlined dark-mode-icon">dark_mode</span>
                </button>
                <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10 cursor-pointer" title="User profile" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCU1-vNUpK19uEL0d0wL3mZoFNYd0BTfkcjwSL-HQmOYf5FIUZandXAQqnjfBOpi6MIBFwr8HJmJ0-bguEBR0P_hO10zs5e3PdOIwXq3zBApSwh25hnPvm8_PQja9RScuMfKyEjTqm4wocljsHV2weRJMvhsqQmuKLetgKbynVc71-74GOgBH77Rbj-yPYux1V-KXA9I2xHpsVo4fHuW8nRcyr_pvsJu3fCI6O_LT9LesgFoLa2XOimQHChqI2GSB-UZ_n03U1Cl_Y");'></div>
            </div>
        </header>

        <main class="flex flex-1 justify-center py-8 px-4 sm:py-12">
            <div class="flex flex-col w-full max-w-2xl">
                <!-- ProgressBar Component -->
                <div class="flex flex-col gap-2 w-full mb-8">
                    <div class="flex justify-between items-center">
                        <p class="text-slate-800 dark:text-slate-200 text-sm font-medium leading-normal">Progress</p>
                        <p class="text-slate-500 dark:text-slate-400 text-sm font-normal leading-normal"><span id="currentQuestion">1</span>/<span id="totalQuestions">20</span></p>
                    </div>
                    <div class="w-full rounded-full bg-slate-200 dark:bg-slate-700 h-2">
                        <div id="quizProgressBar" class="h-2 rounded-full bg-primary transition-all duration-300" style="width: 5%;"></div>
                    </div>
                </div>

                <!-- Main Quiz Card -->
                <div id="quizCard" class="flex flex-col items-center p-6 sm:p-10 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
                    <!-- HeadlineText Component (Question) -->
                    <div class="flex items-center gap-4 mb-8">
                        <h1 id="questionWord" class="text-slate-900 dark:text-white text-4xl sm:text-5xl font-bold leading-tight">안녕하세요</h1>
                        <button id="playQuizAudio" aria-label="Play audio pronunciation" class="flex items-center justify-center size-12 rounded-full text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                            <span class="material-symbols-outlined text-3xl">volume_up</span>
                        </button>
                    </div>

                    <!-- RadioList Component (Answer Options) -->
                    <div id="answerOptions" class="flex flex-col gap-3 w-full mb-8" style="--radio-dot-svg: url('data:image/svg+xml,%3csvg viewBox=%270 0 16 16%27 fill=%27rgb(255,255,255)%27 xmlns=%27http://www.w3.org/2000/svg%27%3e%3ccircle cx=%278%27 cy=%278%27 r=%273%27/%3e%3c/svg%3e');">
                        <!-- Options will be dynamically generated -->
                    </div>

                    <!-- SingleButton Component -->
                    <div class="flex w-full justify-center">
                        <button id="submitAnswer" class="flex w-full max-w-xs cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-primary text-white text-base font-bold leading-normal tracking-wide transition-opacity hover:opacity-90 disabled:opacity-50 disabled:cursor-not-allowed">
                            <span class="truncate">Submit Answer</span>
                        </button>
                    </div>

                    <!-- Feedback Message -->
                    <div id="feedback" class="hidden mt-6 p-4 rounded-lg w-full text-center">
                        <p id="feedbackText" class="font-semibold"></p>
                    </div>
                </div>

                <!-- Results Card (Hidden initially) -->
                <div id="resultsCard" class="hidden flex-col items-center p-6 sm:p-10 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
                    <div class="text-center mb-6">
                        <h2 class="text-slate-900 dark:text-white text-3xl font-bold mb-2">Quiz Complete!</h2>
                        <p class="text-slate-600 dark:text-slate-400">Great job! Here are your results:</p>
                    </div>

                    <div class="w-full max-w-md space-y-4 mb-8">
                        <div class="flex justify-between items-center p-4 bg-slate-50 dark:bg-slate-800 rounded-lg">
                            <span class="text-slate-700 dark:text-slate-300">Correct Answers</span>
                            <span id="correctCount" class="text-2xl font-bold text-success">0</span>
                        </div>
                        <div class="flex justify-between items-center p-4 bg-slate-50 dark:bg-slate-800 rounded-lg">
                            <span class="text-slate-700 dark:text-slate-300">Incorrect Answers</span>
                            <span id="incorrectCount" class="text-2xl font-bold text-error">0</span>
                        </div>
                        <div class="flex justify-between items-center p-4 bg-primary/10 dark:bg-primary/20 rounded-lg">
                            <span class="text-slate-900 dark:text-white font-semibold">Score</span>
                            <span id="scorePercentage" class="text-3xl font-bold text-primary">0%</span>
                        </div>
                    </div>

                    <div class="flex gap-4 w-full max-w-md">
                        <button id="restartQuiz" class="flex-1 cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-primary text-white text-base font-bold leading-normal hover:opacity-90">
                            Try Again
                        </button>
                        <a href="index.html" class="flex-1 flex items-center justify-center rounded-lg h-12 px-5 bg-slate-200 dark:bg-slate-700 text-slate-900 dark:text-white text-base font-bold leading-normal hover:bg-slate-300 dark:hover:bg-slate-600">
                            Back to Home
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Quiz data
        const quizData = [
            {
                korean: "안녕하세요",
                correct: "Hello",
                options: ["Water", "Hello", "House", "School"]
            },
            {
                korean: "사랑",
                correct: "Love",
                options: ["Water", "Love", "House", "School"]
            },
            {
                korean: "물",
                correct: "Water",
                options: ["Love", "Food", "Water", "Friend"]
            },
            {
                korean: "음식",
                correct: "Food",
                options: ["Water", "Love", "Food", "Book"]
            },
            {
                korean: "친구",
                correct: "Friend",
                options: ["Friend", "Family", "Teacher", "Student"]
            },
            {
                korean: "가족",
                correct: "Family",
                options: ["Friend", "Family", "House", "School"]
            },
            {
                korean: "학교",
                correct: "School",
                options: ["House", "School", "Hospital", "Company"]
            },
            {
                korean: "집",
                correct: "House",
                options: ["House", "School", "Room", "Door"]
            },
            {
                korean: "감사합니다",
                correct: "Thank you",
                options: ["Hello", "Thank you", "Sorry", "Goodbye"]
            },
            {
                korean: "미안해요",
                correct: "I'm sorry",
                options: ["Thank you", "I'm sorry", "I love you", "It's okay"]
            },
            {
                korean: "시간",
                correct: "Time",
                options: ["Time", "Money", "Day", "Year"]
            },
            {
                korean: "돈",
                correct: "Money",
                options: ["Time", "Money", "Work", "House"]
            },
            {
                korean: "책",
                correct: "Book",
                options: ["Book", "Phone", "Computer", "Bag"]
            },
            {
                korean: "커피",
                correct: "Coffee",
                options: ["Water", "Coffee", "Tea", "Milk"]
            },
            {
                korean: "오늘",
                correct: "Today",
                options: ["Yesterday", "Today", "Tomorrow", "Now"]
            },
            {
                korean: "내일",
                correct: "Tomorrow",
                options: ["Yesterday", "Today", "Tomorrow", "Now"]
            },
            {
                korean: "이름",
                correct: "Name",
                options: ["Name", "Age", "Phone", "Address"]
            },
            {
                korean: "날씨",
                correct: "Weather",
                options: ["Weather", "Rain", "Snow", "Wind"]
            },
            {
                korean: "영화",
                correct: "Movie",
                options: ["Book", "Movie", "Music", "Game"]
            },
            {
                korean: "음악",
                correct: "Music",
                options: ["Movie", "Music", "Song", "Dance"]
            }
        ];

        // State
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedAnswer = null;

        // DOM elements
        const questionWord = document.getElementById('questionWord');
        const answerOptions = document.getElementById('answerOptions');
        const submitButton = document.getElementById('submitAnswer');
        const feedback = document.getElementById('feedback');
        const feedbackText = document.getElementById('feedbackText');
        const quizCard = document.getElementById('quizCard');
        const resultsCard = document.getElementById('resultsCard');
        const currentQuestionEl = document.getElementById('currentQuestion');
        const totalQuestionsEl = document.getElementById('totalQuestions');
        const quizProgressBar = document.getElementById('quizProgressBar');
        const playQuizAudioBtn = document.getElementById('playQuizAudio');
        const restartQuizBtn = document.getElementById('restartQuiz');
        const darkModeToggle = document.getElementById('darkModeToggle');

        // Initialize
        function init() {
            totalQuestionsEl.textContent = quizData.length;
            loadQuestion();
            setupDarkMode();
        }

        // Load question
        function loadQuestion() {
            const question = quizData[currentQuestionIndex];
            questionWord.textContent = question.korean;
            selectedAnswer = null;

            // Update progress
            currentQuestionEl.textContent = currentQuestionIndex + 1;
            const progress = ((currentQuestionIndex + 1) / quizData.length) * 100;
            quizProgressBar.style.width = progress + '%';

            // Generate options
            answerOptions.innerHTML = '';
            question.options.forEach((option, index) => {
                const label = document.createElement('label');
                label.className = 'flex items-center gap-4 rounded-lg border border-solid border-slate-300 dark:border-slate-700 p-4 cursor-pointer hover:border-primary dark:hover:border-primary has-[:checked]:border-primary has-[:checked]:bg-primary/10 transition-colors';

                const input = document.createElement('input');
                input.className = 'h-5 w-5 border-2 border-slate-300 dark:border-slate-600 bg-transparent text-transparent appearance-none rounded-full checked:border-primary checked:bg-primary checked:bg-[image:--radio-dot-svg] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary dark:focus:ring-offset-slate-900';
                input.type = 'radio';
                input.name = 'quiz-answer';
                input.value = option;
                input.addEventListener('change', () => {
                    selectedAnswer = option;
                    submitButton.disabled = false;
                });

                const p = document.createElement('p');
                p.className = 'text-slate-800 dark:text-slate-200 text-base font-medium leading-normal';
                p.textContent = option;

                label.appendChild(input);
                label.appendChild(p);
                answerOptions.appendChild(label);
            });

            // Reset feedback and button
            feedback.classList.add('hidden');
            submitButton.disabled = true;
            submitButton.textContent = 'Submit Answer';
        }

        // Submit answer
        submitButton.addEventListener('click', () => {
            if (!selectedAnswer) return;

            const question = quizData[currentQuestionIndex];
            const isCorrect = selectedAnswer === question.correct;

            if (isCorrect) {
                score++;
                feedback.classList.remove('hidden', 'bg-error/20', 'text-error');
                feedback.classList.add('bg-success/20', 'text-success');
                feedbackText.textContent = '✓ Correct! Well done!';
            } else {
                feedback.classList.remove('hidden', 'bg-success/20', 'text-success');
                feedback.classList.add('bg-error/20', 'text-error');
                feedbackText.textContent = `✗ Incorrect. The correct answer is "${question.correct}"`;
            }

            // Disable all options
            const inputs = answerOptions.querySelectorAll('input');
            inputs.forEach(input => input.disabled = true);

            // Change button to "Next"
            if (currentQuestionIndex < quizData.length - 1) {
                submitButton.textContent = 'Next Question';
                submitButton.onclick = nextQuestion;
            } else {
                submitButton.textContent = 'See Results';
                submitButton.onclick = showResults;
            }
        });

        // Next question
        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
            submitButton.onclick = null;
        }

        // Show results
        function showResults() {
            quizCard.classList.add('hidden');
            resultsCard.classList.remove('hidden');
            resultsCard.classList.add('flex');

            const correctCount = score;
            const incorrectCount = quizData.length - score;
            const percentage = Math.round((score / quizData.length) * 100);

            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('incorrectCount').textContent = incorrectCount;
            document.getElementById('scorePercentage').textContent = percentage + '%';
        }

        // Restart quiz
        restartQuizBtn.addEventListener('click', () => {
            currentQuestionIndex = 0;
            score = 0;
            resultsCard.classList.add('hidden');
            resultsCard.classList.remove('flex');
            quizCard.classList.remove('hidden');
            loadQuestion();
        });

        // Play audio
        playQuizAudioBtn.addEventListener('click', () => {
            const utterance = new SpeechSynthesisUtterance(quizData[currentQuestionIndex].korean);
            utterance.lang = 'ko-KR';
            window.speechSynthesis.speak(utterance);
        });

        // Dark mode
        function setupDarkMode() {
            const htmlElement = document.documentElement;
            const darkModeIcon = document.querySelector('.dark-mode-icon');

            const currentTheme = localStorage.getItem('theme') || 'light';
            htmlElement.classList.remove('light', 'dark');
            htmlElement.classList.add(currentTheme);
            updateDarkModeIcon(currentTheme);

            darkModeToggle.addEventListener('click', () => {
                const isDark = htmlElement.classList.contains('dark');

                if (isDark) {
                    htmlElement.classList.remove('dark');
                    htmlElement.classList.add('light');
                    localStorage.setItem('theme', 'light');
                    updateDarkModeIcon('light');
                } else {
                    htmlElement.classList.remove('light');
                    htmlElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                    updateDarkModeIcon('dark');
                }
            });

            function updateDarkModeIcon(theme) {
                if (theme === 'dark') {
                    darkModeIcon.textContent = 'light_mode';
                } else {
                    darkModeIcon.textContent = 'dark_mode';
                }
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
